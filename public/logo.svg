<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" fill="none">
  <!-- Background glow / badge -->
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D8FF"/>
      <stop offset="100%" stop-color="#1A368D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00D8FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(4, 4)">
    <!-- Rounded icon tile -->
    <rect width="40" height="40" rx="10" fill="#0A1142" stroke="#00D8FF" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="1.5" y="1.5" width="37" height="37" rx="8.5" fill="#1A368D" fill-opacity="0.25"/>
    
    <!-- Dynamic Upward Growth Arrow & Graduation Cap Chevron -->
    <!-- Upward Growth Arrow in #00D8FF -->
    <path d="M20 9L30 19H24V29H16V19H10L20 9Z" fill="url(#badgeGrad)" filter="url(#glow)"/>
    <path d="M14 27L20 22L26 27" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Tiny star/sparkle at apex -->
    <circle cx="20" cy="8.5" r="1.5" fill="#00D8FF"/>
  </g>

  <!-- Typography: GRADE UPGRADE -->
  <text x="54" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
    GRADE <tspan fill="#00D8FF">UP</tspan>GRADE
  </text>
  <text x="54" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#00D8FF" fill-opacity="0.85">
    ACADEMY &bull; GRADES 8-12
  </text>
</svg>